<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="creamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3b64a" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#17110f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="creamSauce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="60%" stop-color="#f5e8d0"/>
      <stop offset="100%" stop-color="#dfcfb0"/>
    </linearGradient>
    <linearGradient id="pastaYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae2a5"/>
      <stop offset="100%" stop-color="#e2ae58"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#181210"/>
  <rect width="800" height="600" fill="url(#creamGlow)"/>

  <!-- Ceramic Plate -->
  <circle cx="400" cy="270" r="190" fill="#251e1b" stroke="rgba(247, 240, 231, 0.12)" stroke-width="4"/>
  <circle cx="400" cy="270" r="150" fill="#1e1816" stroke="rgba(247, 240, 231, 0.06)" stroke-width="2"/>

  <!-- Velvety Cream Sauce Bed -->
  <ellipse cx="400" cy="270" rx="120" ry="105" fill="url(#creamSauce)"/>

  <!-- Penne Pasta in White Sauce -->
  <g transform="translate(360, 235) rotate(-15)">
    <rect x="-35" y="-12" width="70" height="24" rx="4" fill="url(#pastaYellow)"/>
    <ellipse cx="35" cy="0" rx="4" ry="12" fill="#c4832c"/>
  </g>
  <g transform="translate(435, 245) rotate(40)">
    <rect x="-35" y="-12" width="70" height="24" rx="4" fill="url(#pastaYellow)"/>
    <ellipse cx="35" cy="0" rx="4" ry="12" fill="#c4832c"/>
  </g>
  <g transform="translate(390, 295) rotate(-5)">
    <rect x="-35" y="-12" width="70" height="24" rx="4" fill="url(#pastaYellow)"/>
    <ellipse cx="35" cy="0" rx="4" ry="12" fill="#c4832c"/>
  </g>
  <g transform="translate(445, 290) rotate(-35)">
    <rect x="-30" y="-10" width="60" height="20" rx="4" fill="url(#pastaYellow)"/>
    <ellipse cx="30" cy="0" rx="3" ry="10" fill="#c4832c"/>
  </g>
  <g transform="translate(345, 290) rotate(50)">
    <rect x="-30" y="-10" width="60" height="20" rx="4" fill="url(#pastaYellow)"/>
    <ellipse cx="30" cy="0" rx="3" ry="10" fill="#c4832c"/>
  </g>

  <!-- Garlic butter drizzle & herb flecks -->
  <circle cx="395" cy="255" r="14" fill="#eed9b2" opacity="0.6"/>
  <circle cx="410" cy="280" r="10" fill="#e6ca99" opacity="0.6"/>
  <!-- Black pepper and parsley -->
  <circle cx="380" cy="245" r="1.5" fill="#2d221e"/>
  <circle cx="420" cy="235" r="1.5" fill="#2d221e"/>
  <circle cx="405" cy="270" r="2" fill="#2d221e"/>
  <circle cx="370" cy="285" r="1.5" fill="#2d221e"/>
  <circle cx="430" cy="285" r="2" fill="#2d221e"/>
  <!-- Parsley flecks -->
  <path d="M410,240 Q418,235 422,242 Q415,248 410,240 Z" fill="#48a04c"/>
  <path d="M375,265 Q370,258 365,268 Q375,274 375,265 Z" fill="#3b8b3f"/>

  <!-- Label Overlay -->
  <g transform="translate(400, 485)" text-anchor="middle">
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="rgba(23, 17, 15, 0.85)" stroke="rgba(243, 182, 74, 0.4)" stroke-width="1.5"/>
    <text font-family="'Syne', sans-serif" font-size="16" font-weight="800" fill="#f7f0e7" y="5">
      WHITE CREAM PASTA
    </text>
  </g>
</svg>
