<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="friesGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3b64a" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#17110f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fryGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce398"/>
      <stop offset="50%" stop-color="#f3b64a"/>
      <stop offset="100%" stop-color="#d49226"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#181210"/>
  <rect width="800" height="600" fill="url(#friesGlow)"/>

  <!-- Serving Tray / Plate Base -->
  <ellipse cx="400" cy="380" rx="200" ry="70" fill="#150f0e" opacity="0.6"/>
  <rect x="250" y="240" width="300" height="150" rx="14" fill="#241d1a" stroke="rgba(247, 240, 231, 0.12)" stroke-width="3"/>

  <!-- Batch of Golden Crisp French Fries -->
  <!-- Left leaning -->
  <rect x="290" y="140" width="16" height="170" rx="4" fill="url(#fryGold)" transform="rotate(-18 290 200)"/>
  <rect x="315" y="130" width="16" height="180" rx="4" fill="url(#fryGold)" transform="rotate(-12 315 200)"/>
  <rect x="340" y="125" width="16" height="185" rx="4" fill="url(#fryGold)" transform="rotate(-6 340 200)"/>
  <!-- Center straight -->
  <rect x="365" y="120" width="16" height="190" rx="4" fill="url(#fryGold)"/>
  <rect x="390" y="115" width="16" height="195" rx="4" fill="url(#fryGold)"/>
  <rect x="415" y="120" width="16" height="190" rx="4" fill="url(#fryGold)"/>
  <!-- Right leaning -->
  <rect x="440" y="125" width="16" height="185" rx="4" fill="url(#fryGold)" transform="rotate(7 440 200)"/>
  <rect x="465" y="130" width="16" height="180" rx="4" fill="url(#fryGold)" transform="rotate(14 465 200)"/>
  <rect x="490" y="140" width="16" height="170" rx="4" fill="url(#fryGold)" transform="rotate(20 490 200)"/>

  <!-- Salt flakes & golden crisp details -->
  <circle cx="345" cy="160" r="2" fill="#fffdf9"/>
  <circle cx="395" cy="140" r="2.5" fill="#fffdf9"/>
  <circle cx="445" cy="155" r="2" fill="#fffdf9"/>
  <circle cx="370" cy="180" r="2" fill="#fffdf9"/>
  <circle cx="420" cy="175" r="2.5" fill="#fffdf9"/>

  <!-- Red Tomato Ketchup Dipping Ramekin -->
  <g transform="translate(400, 360)">
    <ellipse cx="0" cy="0" rx="45" ry="24" fill="#201815" stroke="rgba(247, 240, 231, 0.16)" stroke-width="2"/>
    <ellipse cx="0" cy="-2" rx="38" ry="18" fill="#d94b38"/>
    <ellipse cx="-5" cy="-5" rx="14" ry="5" fill="#ea6a59" opacity="0.8"/>
  </g>

  <!-- Label Overlay -->
  <g transform="translate(400, 485)" text-anchor="middle">
    <rect x="-120" y="-22" width="240" height="44" rx="22" fill="rgba(23, 17, 15, 0.85)" stroke="rgba(243, 182, 74, 0.4)" stroke-width="1.5"/>
    <text font-family="'Syne', sans-serif" font-size="16" font-weight="800" fill="#f7f0e7" y="5">
      CRISP GOLDEN FRIES
    </text>
  </g>
</svg>
