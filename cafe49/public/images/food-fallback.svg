<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1816"/>
      <stop offset="50%" stop-color="#17110f"/>
      <stop offset="100%" stop-color="#0f0b0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#d94b38" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#f3b64a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#17110f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d94b38"/>
      <stop offset="100%" stop-color="#f3b64a"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Geometric Subtle Food Platter Ring -->
  <circle cx="400" cy="270" r="170" fill="none" stroke="rgba(247, 240, 231, 0.05)" stroke-width="2"/>
  <circle cx="400" cy="270" r="140" fill="#201917" stroke="rgba(247, 240, 231, 0.08)" stroke-width="2"/>
  <circle cx="400" cy="270" r="110" fill="none" stroke="rgba(243, 182, 74, 0.15)" stroke-dasharray="6,6" stroke-width="2"/>

  <!-- Icon: Cloche / Platter Icon -->
  <g transform="translate(400, 260) scale(1.6)" text-anchor="middle">
    <!-- Plate base -->
    <path d="M-36,18 L36,18 C36,20 34,22 30,22 L-30,22 C-34,22 -36,20 -36,18 Z" fill="#f3b64a"/>
    <!-- Dome -->
    <path d="M-32,14 C-32,-12 32,-12 32,14 Z" fill="none" stroke="#f7f0e7" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Knob -->
    <circle cx="0" cy="-16" r="4.5" fill="#d94b38"/>
    <!-- Steam waves -->
    <path d="M-8,-26 C-10,-32 -6,-36 -8,-42" fill="none" stroke="#f3b64a" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M0,-28 C-2,-34 2,-38 0,-44" fill="none" stroke="#f7f0e7" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <path d="M8,-26 C6,-32 10,-36 8,-42" fill="none" stroke="#f3b64a" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Typography -->
  <!-- Wordmark -->
  <g transform="translate(400, 435)" text-anchor="middle">
    <text font-family="'Syne', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#f7f0e7" letter-spacing="4">
      CAFE <tspan fill="#d94b38">49</tspan>
    </text>
  </g>

  <g transform="translate(400, 470)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#a99a8d" letter-spacing="2">
      FRESH TO ORDER • SAMRALA
    </text>
  </g>

  <!-- Accent bottom stripe -->
  <rect x="360" y="500" width="80" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
